[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openknet"
version = "2.0.0"
description = "Production-grade generalist knowledge network mining framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "typer>=0.12",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "PyYAML>=6.0",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "sqlalchemy[asyncio]>=2.0",
  "aiosqlite>=0.20",
  "asyncpg>=0.30",
  "rank-bm25>=0.2.2",
  "pypdf>=4.0",
  "python-docx>=1.1",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "scikit-learn>=1.4",
  "numpy>=1.26",
  "loguru>=0.7",
  "chardet>=5.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.30"]
langgraph = ["langgraph>=0.2", "langchain-core>=0.3", "langchain-anthropic>=0.3"]
ollama   = ["langchain-ollama>=0.2"]
openai   = ["langchain-openai>=0.2"]
nlp      = ["spacy>=3.7", "gliner>=0.2"]
semantic  = ["sentence-transformers>=3.0"]
redis     = ["redis>=5.0"]
worker    = ["arq>=0.26"]
metrics   = ["prometheus-client>=0.20"]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "httpx>=0.27",
]
all = [
  "asyncpg>=0.30",
  "sentence-transformers>=3.0",
  "redis>=5.0",
  "arq>=0.26",
  "prometheus-client>=0.20",
]

[project.scripts]
openknet = "openknet.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["openknet*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
